          extend: {
            keyframes: {
              shake: {

                '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-10px)' },

      const PALETTES = [
        { bg1: '#6366f1', bg2: '#4338ca', accent: '#fbbf24' },
        { bg1: '#ec4899', bg2: '#be185d', accent: '#a7f3d0' },
        { bg1: '#10b981', bg2: '#047857', accent: '#fde047' },
        { bg1: '#f59e0b', bg2: '#b45309', accent: '#bae6fd' },
        { bg1: '#3b82f6', bg2: '#1d4ed8', accent: '#fcd34d' },
        { bg1: '#8b5cf6', bg2: '#6d28d9', accent: '#6ee7b7' },
        { bg1: '#14b8a6', bg2: '#0f766e', accent: '#fca5a5' },
        { bg1: '#f97316', bg2: '#c2410c', accent: '#fef08a' }
      ];

      function createWordSvgIllustration(word) {
        const cleanWord = (word || '').trim().toLowerCase();
        const titleWord = cleanWord.charAt(0).toUpperCase() + cleanWord.slice(1);
        let hash = 0;
        for (let i = 0; i < cleanWord.length; i++) {
          hash = (hash * 31 + cleanWord.charCodeAt(i)) % 1000000;
        }
        const palette = PALETTES[Math.abs(hash) % PALETTES.length];
        const emoji = WORD_EMOJIS[cleanWord];
        const initial = titleWord.charAt(0) || 'A';

        const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
          <defs>
            <linearGradient id="grad-${hash}" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="${palette.bg1}" />
              <stop offset="100%" stop-color="${palette.bg2}" />
            </linearGradient>
          </defs>
          <rect width="400" height="400" rx="32" fill="url(#grad-${hash})" />
          <circle cx="60" cy="70" r="45" fill="rgba(255,255,255,0.14)" />
          <circle cx="340" cy="90" r="30" fill="rgba(255,255,255,0.18)" />
          <circle cx="350" cy="330" r="55" fill="rgba(255,255,255,0.12)" />
          <circle cx="70" cy="340" r="40" fill="rgba(255,255,255,0.14)" />
          ${emoji ? `<text x="200" y="180" font-size="110" text-anchor="middle" dominant-baseline="central">${emoji}</text>` : `
            <circle cx="200" cy="160" r="50" fill="rgba(255,255,255,0.2)" />
            <text x="200" y="172" font-family="sans-serif" font-size="56" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">${initial}</text>
          `}
          <text x="200" y="310" font-family="sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">${titleWord}</text>
        </svg>`;
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.trim());
      }

      const getPhonetic = async (word) => {
        const clean = word.toLowerCase().trim();
        return COMMON_IPA[clean] || `/${clean}/`;
      };

      const getSentence = async (word) => {
        const clean = word.toLowerCase().trim();
        return COMMON_SENTENCES[clean] || `${word} is a great word for our spelling practice.`;
      };

      const getImage = async (word) => {
        return createWordSvgIllustration(word);
      };

      const downloadZip = async (words, courseName) => {
        if (typeof JSZip === 'undefined') throw new Error('JSZip not loaded');
        const zip = new JSZip();
        let audioCount = 0;
        for (const word of words) {
          if (word.status === WordStatus.COMPLETED && word.audioData) {
            const fileName = `${word.text.toLowerCase().replace(/[^a-z0-9]/gi, '_')}.wav`;
            zip.file(fileName, word.audioData);
            audioCount++;
          }
        }
        if (audioCount === 0) throw new Error('No audio files to zip.');
        const content = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${courseName.toLowerCase().replace(/[^a-z0-9]/gi, '_')}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const parseDocx = async (file) => {
        if (typeof mammoth === 'undefined') throw new Error('Mammoth.js not found.');
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer });
        return result.value
          .split(/\r?\n/)
          .map(w => w.trim())
          .filter(w => w && !/\d/.test(w));
      };

      const parseXlsx = async (file) => {
        if (typeof XLSX === 'undefined') throw new Error('XLSX.js not found.');
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data);
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
        return json
          .flat()
          .map(cell => (cell ? String(cell).trim() : ''))
          .filter(cell => cell && !/\d/.test(cell));
      };

      const parsePdf = async (file) => {
        if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js not found.');
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const words = [];
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageWords = textContent.items
            .map(item => ('str' in item ? item.str.trim() : ''))
            .filter(w => w && !/\d/.test(w));
          for (const wordText of pageWords) {
            words.push({
              id: generateUniqueId(wordText),
              text: wordText,
              status: WordStatus.PENDING,
              phonetic: null,
              sentence: null,
              imageUrl: null,
              audioUrl: null,
              audioData: null,
              error: null,
            });
          }
        }
        return words;
      };

      const parseZip = async (file, currentWords) => {
        if (typeof JSZip === 'undefined') throw new Error('JSZip not found.');
        const zip = new JSZip();
        const content = await zip.loadAsync(file);
        const matched = [];
        const unmatched = [];
        for (const [filename, zipEntry] of Object.entries(content.files)) {
          if (!zipEntry.dir && filename.toLowerCase().endsWith('.wav')) {
            const wordName = filename.replace(/\.[^/.]+$/, '').toLowerCase();
            const blob = await zipEntry.async('blob');
            const matchingWord = currentWords.find(w => w.toLowerCase() === wordName);
            if (matchingWord) {
              matched.push({ text: matchingWord, audioBlob: blob });
            } else {
              unmatched.push(wordName);
            }
          }
        }
        return { matched, unmatched };
      };

      const Spinner = ({ className = 'w-8 h-8 text-white', title = 'Loading...' }) => (
        <svg className={`animate-spin ${className}`} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-label={title}>

      const ToastItem = ({ toast, onRemove }) => {
        useEffect(() => {
          const timer = setTimeout(() => {
            onRemove(toast.id);
          }, 5000);
          return () => clearTimeout(timer);
        }, [toast.id, onRemove]);

        const icons = {
          success: <CheckCircleIcon className="h-6 w-6 text-green-500 flex-shrink-0" />,
          error: <XCircleIcon className="h-6 w-6 text-red-500 flex-shrink-0" />,
          info: <InformationCircleIcon className="h-6 w-6 text-blue-500 flex-shrink-0" />,

        return (
          <div className="bg-white dark:bg-gray-800 shadow-xl border border-gray-100 dark:border-gray-700 rounded-lg p-3 sm:p-4 flex items-start space-x-3 transition-all duration-200">
            <div className="flex-shrink-0">{icons[toast.type]}</div>
            <div className="flex-1 min-w-0">

              <XIcon className="h-4 w-4" />
            </button>
          </div>
        );
      };

      const Toast = ({ toasts, setToasts }) => {
        const removeToast = useCallback((id) => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, [setToasts]);

        return (
          <div className="fixed bottom-3 right-3 sm:bottom-5 sm:right-5 z-50 space-y-2 w-[calc(100%-24px)] sm:w-full max-w-sm pointer-events-auto">
            {toasts.map(toast => (
              <ToastItem key={toast.id} toast={toast} onRemove={removeToast} />
            ))}
          </div>
        );
      };

      const WordItem = ({ word, onRegenerate, onDelete, onOpenSpellingBee, onImageClick, onSpeak }) => {
        const audioRef = useRef(null);

        const playAudio = () => {
          if (word.audioUrl) {
            if (audioRef.current) {
              audioRef.current.currentTime = 0;
              audioRef.current.play();
            } else {
              const audio = new Audio(word.audioUrl);
              audio.play();
            }
          } else if (onSpeak) {
            onSpeak(word.text);
          } else if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word.text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
          }
        };

        const handleImageClick = () => {
          playAudio();
          if (onImageClick) {
            onImageClick(word);
          }

        return (
          <div className="p-3 sm:p-4 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4 transition hover:shadow-md">
            <div className="flex items-center space-x-3 w-full sm:w-auto">
              {word.imageUrl ? (
                <img
                  src={word.imageUrl}
                  alt={word.text}
                  onClick={handleImageClick}
                  className="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 rounded-lg object-cover flex-shrink-0 cursor-pointer hover:opacity-80 transition transform hover:scale-105"
                  title="Presiona para escuchar"
                />
              ) : (
                <div
                  onClick={handleImageClick}
                  className="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 rounded-lg bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 font-bold text-xs sm:text-sm flex items-center justify-center p-1 text-center flex-shrink-0 cursor-pointer hover:opacity-80 transition transform hover:scale-105 border border-indigo-200 dark:border-indigo-700 overflow-hidden leading-tight"
                  title="Presiona para escuchar"
                >
                  {word.text}
                </div>
              )}
              <div className="flex-1 min-w-0">
                <p
                  onClick={playAudio}
                  className="text-base sm:text-lg font-bold text-gray-900 dark:text-white truncate cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition"
                  title="Presiona para escuchar"
                >
                  {word.text}
                </p>
                {word.phonetic && <p className="text-xs sm:text-sm text-gray-500 dark:text-gray-400">{word.phonetic}</p>}
                {word.sentence && <p className="text-xs text-gray-400 dark:text-gray-500 italic mt-1 truncate">{word.sentence}</p>}
                {word.error && <p className="text-xs text-red-500 mt-1">{word.error}</p>}
              </div>
            </div>

            <div className="flex items-center justify-end space-x-1 sm:space-x-2 w-full sm:w-auto flex-shrink-0 border-t sm:border-t-0 pt-2 sm:pt-0 border-gray-100 dark:border-gray-700/50">
              {word.status === WordStatus.PENDING && (
                <span className="text-xs bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-2 py-1 rounded">Pending</span>
              )}
              {word.status === WordStatus.PROCESSING && <Spinner className="w-5 h-5 text-indigo-500" />}
              {word.status === WordStatus.COMPLETED && (
                <>
                  <button onClick={playAudio} className="p-2 text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition" title="Play Sound">
                    <PlayIcon className="h-5 w-5" />
                  </button>
                  {word.audioUrl && <audio ref={audioRef} src={word.audioUrl} preload="auto" />}
                  <button onClick={() => onOpenSpellingBee(word)} className="p-2 text-gray-600 dark:text-gray-300 hover:text-green-600 dark:hover:text-green-400 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition" title="Practice Spelling">
                    <MicrophoneIcon className="h-5 w-5" />

              {word.status === WordStatus.FAILED && (
                <span className="text-xs bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 px-2 py-1 rounded">Failed</span>

              <button onClick={() => onRegenerate(word.id)} className="p-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition" title="Regenerate">
                <RefreshIcon className="h-4 w-4" />

              <button onClick={() => onDelete(word.id)} className="p-2 text-red-400 hover:text-red-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition" title="Delete">
                <TrashIcon className="h-4 w-4" />
              </button>
            </div>
          </div>
        );
      };

      const MainContent = ({
        words,
        onAddWords,
        onFileLoad,
        onGenerate,
        onDeleteWord,
        onRegenerateWord,
        onOpenSpellingBee,
        onImageClick,
        onSpeak,
        isGenerating,
      }) => {
        const pendingIds = words.filter(w => w.status === WordStatus.PENDING).map(w => w.id);
        const allIds = words.map(w => w.id);

        return (
          <main className="flex-1 p-3 sm:p-6 space-y-4 sm:space-y-6">
            {/* Actions Bar */}
            <div className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4">
              <div className="text-sm font-medium text-center sm:text-left">
                Total Words: <span className="font-bold text-indigo-600 dark:text-indigo-400">{words.length}</span>
              </div>
              <div className="flex flex-wrap justify-center sm:justify-end gap-2 w-full sm:w-auto">
                <button
                  onClick={() => onGenerate(allIds)}

                  className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition flex items-center justify-center space-x-2 disabled:opacity-50 text-sm sm:text-base active:scale-95"
                >
                  <SparklesIcon className="h-5 w-5" />
                  <span>Regenerate All</span>
                </button>

            {/* Words List */}
            {words.length > 0 && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
                {words.map(w => (
                  <WordItem
                    key={w.id}
                    word={w}
                    onRegenerate={onRegenerateWord}
                    onDelete={onDeleteWord}

                    onImageClick={onImageClick}
                    onSpeak={onSpeak}
                  />
                ))}
              </div>
            )}
          </main>
        );
      };

      const SpellingBee = ({ word, onClose, onPronounce, onSpellOut }) => {
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-gray-950/80 backdrop-blur-md overflow-y-auto">
            <div className="bg-white dark:bg-gray-800 p-5 sm:p-8 rounded-3xl max-w-xl w-full text-center relative shadow-2xl border border-gray-200 dark:border-gray-700 my-auto">
              <button onClick={onClose} className="absolute top-4 right-4 sm:top-6 sm:right-6 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-2xl font-bold p-1">
                ✕
              </button>

              <h2 className="text-xl sm:text-2xl font-bold mb-3 sm:mb-4 text-indigo-600 dark:text-indigo-400">Spelling Challenge</h2>
              {word.imageUrl ? (
                <img 
                  src={word.imageUrl} 
                  alt={word.text} 
                  onClick={() => onPronounce(word.text)}
                  className="w-[380px] h-[380px] max-w-full max-h-[45vh] object-contain mx-auto rounded-2xl mb-4 cursor-pointer hover:opacity-80 transition transform hover:scale-105" 
                  title="Presiona para escuchar"
                />
              ) : (
                <div 
                  onClick={() => onPronounce(word.text)}
                  className="w-[380px] h-[380px] max-w-full max-h-[45vh] mx-auto rounded-2xl mb-4 bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 font-black text-2xl sm:text-4xl flex items-center justify-center p-3 text-center cursor-pointer hover:opacity-80 transition transform hover:scale-105 border-2 border-indigo-300 dark:border-indigo-600 break-words" 
                  title="Presiona para escuchar"
                >
                  {word.text}
                </div>
              )}

              <p className="text-2xl sm:text-3xl font-black text-gray-800 dark:text-white mb-6 break-words max-w-full text-center">{word.text}</p>

              <div className="flex flex-col sm:flex-row justify-center gap-3">
                <button
                  onClick={() => onPronounce(word.text)}
                  className="w-full sm:w-auto px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold flex items-center justify-center space-x-2 transition shadow active:scale-95"
                >
                  <PlayIcon className="h-5 w-5" />
                  <span>Listen</span>
                </button>
                <button
                  onClick={() => onSpellOut(word.text)}
                  className="w-full sm:w-auto px-5 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold flex items-center justify-center space-x-2 transition shadow active:scale-95"
                >
                  <MicrophoneIcon className="h-5 w-5" />
                  <span>Spell Out</span>
                </button>
              </div>
            </div>
          </div>
        );
      };

      const SpinningWheel = ({ words, onClose, background, logo, onOpenSpellingBee, onSpeak }) => {
        const canvasRef = useRef(null);
        const [selectedWord, setSelectedWord] = useState(null);
        const [isSpinning, setIsSpinning] = useState(false);
        const [showCard, setShowCard] = useState(false);
        const [isSpellingSequence, setIsSpellingSequence] = useState(false);
        const [activeLetterIndex, setActiveLetterIndex] = useState(-1);
        const [isSpeakingWholeWord, setIsSpeakingWholeWord] = useState(false);
        const [canvasSize, setCanvasSize] = useState(500);
        const [removedWordIds, setRemovedWordIds] = useState(new Set());

        // Voice Challenge & Audio Recording State
        const [isRecording, setIsRecording] = useState(false);
        const [voiceInstruction, setVoiceInstruction] = useState('');

        // Recording & Spoken Transcripts State
        const [recordedAudioUrl, setRecordedAudioUrl] = useState(null);
        const [isPlayingRecording, setIsPlayingRecording] = useState(false);
        
        const mediaRecorderRef = useRef(null);
        const audioChunksRef = useRef([]);
        const recordedAudioRef = useRef(null);

        const currentAngleRef = useRef(0);
        const angularVelocityRef = useRef(0);
        const animationFrameRef = useRef(0);
        const loadedImagesRef = useRef({});
        const lastTickSegmentRef = useRef(-1);
        const audioCtxRef = useRef(null);

        const stopAudioRecording = useCallback(() => {
          if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
            try {
              mediaRecorderRef.current.stop();
            } catch (e) {}
          }
        }, []);

        const handleVoiceChallenge = async () => {
          if (isRecording) {
            stopAudioRecording();
            setIsRecording(false);
            setVoiceInstruction('✅ Grabación finalizada. ¡Haz clic en "Mi Grabación" para escuchar!');
            return;
          }

          if (recordedAudioUrl) {
            URL.revokeObjectURL(recordedAudioUrl);
            setRecordedAudioUrl(null);
          }
          setIsPlayingRecording(false);

          try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              audioChunksRef.current = [];
              const mediaRecorder = new MediaRecorder(stream);
              mediaRecorderRef.current = mediaRecorder;

              mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                  audioChunksRef.current.push(event.data);
                }
              };

              mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                const url = URL.createObjectURL(audioBlob);
                setRecordedAudioUrl(url);
                stream.getTracks().forEach(track => track.stop());
              };

              mediaRecorder.start();
              setIsRecording(true);
              setVoiceInstruction('🎙️ Grabando voz... Presiona el micrófono nuevamente para detener.');
            } else {
              setVoiceInstruction('❌ Tu navegador no admite la grabación de voz.');
            }
          } catch (err) {
            console.warn('Could not record voice audio:', err);
            setVoiceInstruction('❌ Permiso de micrófono denegado o no disponible.');
          }
        };

        const playRecordedAudio = (e) => {
          if (e) e.stopPropagation();
          if (!recordedAudioUrl) return;

          if (recordedAudioRef.current) {
            recordedAudioRef.current.pause();
          }

          const audio = new Audio(recordedAudioUrl);
          recordedAudioRef.current = audio;
          setIsPlayingRecording(true);
          audio.onended = () => setIsPlayingRecording(false);
          audio.onerror = () => setIsPlayingRecording(false);
          audio.play().catch(() => setIsPlayingRecording(false));
        };

        const playTick = useCallback(() => {
          try {
            if (!audioCtxRef.current) {
              audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
            }
            const ctx = audioCtxRef.current;
            if (ctx.state === 'suspended') {
              ctx.resume();
            }
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800 + Math.random() * 80, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.012);

            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.012);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.012);
          } catch (e) {}
        }, []);

        const validWords = useMemo(() => words.filter(w => w.status !== WordStatus.FAILED && !removedWordIds.has(w.id)), [words, removedWordIds]);

        const validWordsRef = useRef(validWords);
        useEffect(() => {
          validWordsRef.current = validWords;
        }, [validWords]);

        const colors = useMemo(() => [
          '#F43F5E', '#8B5CF6', '#3B82F6', '#10B981', '#F59E0B', '#EC4899', '#06B6D4', '#6366F1'
        ], []);

        useEffect(() => {
          const updateSize = () => {
            const size = Math.min(window.innerWidth - 24, window.innerHeight - 120, 700);
            setCanvasSize(Math.max(size, 260));
          };
          updateSize();
          window.addEventListener('resize', updateSize);
          return () => window.removeEventListener('resize', updateSize);
        }, []);

        const drawWheel = useCallback(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const numSegments = validWords.length;
          const segmentAngle = (2 * Math.PI) / (numSegments || 1);
          const centerX = canvas.width / 2;
          const centerY = canvas.height / 2;
          const radius = canvas.width / 2 - 20;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          validWords.forEach((word, index) => {
            const startAngle = currentAngleRef.current + index * segmentAngle;
            const endAngle = startAngle + segmentAngle;

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = colors[index % colors.length];
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(startAngle + segmentAngle / 2);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 3;
            const fontSize = Math.max(10, Math.floor(canvas.width / 28));
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.fillText(word.text, radius - 20, fontSize / 3);
            ctx.shadowBlur = 0;

            ctx.restore();
          });

          const centerRadius = Math.max(20, Math.floor(canvas.width * 0.08));
          ctx.beginPath();
          ctx.arc(centerX, centerY, centerRadius, 0, 2 * Math.PI);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#333333';
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(centerX + radius + 15, centerY);
          ctx.lineTo(centerX + radius - 12, centerY - 12);
          ctx.lineTo(centerX + radius - 12, centerY + 12);
          ctx.closePath();
          ctx.fillStyle = '#e11d48';
          ctx.fill();
          ctx.stroke();
        }, [validWords, colors, canvasSize]);

        useEffect(() => {
          let isMounted = true;
          validWords.forEach(word => {
            if (word.imageUrl && !loadedImagesRef.current[word.id]) {
              const img = new Image();
              img.src = word.imageUrl;
              img.onload = () => {
                if (isMounted) {
                  loadedImagesRef.current[word.id] = img;
                  drawWheel();
                }
              };
            }
          });
          return () => { isMounted = false; };
        }, [validWords, drawWheel]);

        useEffect(() => {
          drawWheel();
        }, [drawWheel]);

        const spin = (forcedTargetIndex = null) => {
          const activeList = validWordsRef.current;
          if (isSpinning || activeList.length === 0) return;
          if (isRecording) {
            stopAudioRecording();
            setIsRecording(false);
          }
          setIsSpinning(true);
          setShowCard(false);

          const targetDuration = 4000;
          const startTime = performance.now();
          const startAngle = currentAngleRef.current;

          const numSegments = activeList.length;
          const segmentAngle = (2 * Math.PI) / (numSegments || 1);

          let targetDelta;
          if (forcedTargetIndex !== null && forcedTargetIndex >= 0 && forcedTargetIndex < numSegments) {
            const targetSegmentCenter = (forcedTargetIndex + 0.5) * segmentAngle;
            const desiredMod = (2 * Math.PI - (targetSegmentCenter % (2 * Math.PI))) % (2 * Math.PI);
            const currentMod = startAngle % (2 * Math.PI);
            let diff = desiredMod - currentMod;
            if (diff <= 0) diff += 2 * Math.PI;
            targetDelta = diff + 6 * 2 * Math.PI;
          } else {
            const randomSpins = 5 + Math.random() * 5;
            targetDelta = randomSpins * 2 * Math.PI;
          }

          const animate = (currentTime) => {
            const elapsed = currentTime - startTime;
            if (elapsed < targetDuration) {
              const progress = elapsed / targetDuration;
              const easeOut = 1 - Math.pow(1 - progress, 3);
              currentAngleRef.current = startAngle + easeOut * targetDelta;
              
              const currentSegment = Math.floor(currentAngleRef.current / segmentAngle);
              if (currentSegment !== lastTickSegmentRef.current) {
                playTick();
                lastTickSegmentRef.current = currentSegment;
              }

              drawWheel();
              animationFrameRef.current = requestAnimationFrame(animate);
            } else {
              currentAngleRef.current = startAngle + targetDelta;
              drawWheel();
              setIsSpinning(false);
              const currentValid = validWordsRef.current;
              const numSegments = currentValid.length;
              if (numSegments > 0) {
                const segmentAngle = (2 * Math.PI) / numSegments;
                const normalizedAngle = (2 * Math.PI - (currentAngleRef.current % (2 * Math.PI))) % (2 * Math.PI);
                const winningIndex = Math.floor(normalizedAngle / segmentAngle) % numSegments;
                const chosen = currentValid[winningIndex];
                setSelectedWord(chosen);
                setShowCard(true);
                if (chosen) {
                  setRemovedWordIds(prev => new Set(prev).add(chosen.id));
                  playWordAudio(chosen.text);
                }
              }
            }
          };

          animationFrameRef.current = requestAnimationFrame(animate);
        };

        useEffect(() => {
          const handleKeyDown = (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) {
              e.preventDefault();
              const activeList = validWordsRef.current;
              if (activeList.length === 0) return;

              let maxLen = -1;
              let longestIndex = 0;
              activeList.forEach((w, idx) => {
                if (w.text.length > maxLen) {
                  maxLen = w.text.length;
                  longestIndex = idx;
                }
              });

              if (showCard) {
                setShowCard(false);
              }

              if (!isSpinning) {
                spin(longestIndex);
              }
            }
          };

          window.addEventListener('keydown', handleKeyDown);
          return () => window.removeEventListener('keydown', handleKeyDown);
        }, [isSpinning, showCard]);

        useEffect(() => {
          return () => cancelAnimationFrame(animationFrameRef.current);
        }, []);

        const handleContainerClick = () => {
          if (showCard) return;
          spin();
        };

        const playImageSound = () => {
          if (!selectedWord) return;
          playWordAudio(selectedWord.text);
        };

        const playWordAudio = (wordText) => {
          setIsSpeakingWholeWord(true);
          return new Promise((resolve) => {
            let resolved = false;
            const done = () => {
              if (!resolved) {
                resolved = true;
                setIsSpeakingWholeWord(false);
                resolve();
              }
            };
            if (selectedWord && selectedWord.audioUrl) {
              const audio = new Audio(selectedWord.audioUrl);
              audio.onended = done;
              audio.onerror = done;
              audio.play().catch(done);
              setTimeout(done, 3000);
            } else if (window.speechSynthesis) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(wordText);
              utterance.lang = 'en-US';
              utterance.rate = 0.8;
              utterance.onend = done;
              utterance.onerror = done;
              window.speechSynthesis.speak(utterance);
              setTimeout(done, 3000);
            } else {
              done();
            }
          });
        };

        const playLetterAudio = (letter) => {
          return new Promise((resolve) => {
            if (!window.speechSynthesis) return setTimeout(resolve, 600);
            window.speechSynthesis.cancel();
            let resolved = false;
            const done = () => {
              if (!resolved) {
                resolved = true;
                resolve();
              }
            };
            const utterance = new SpeechSynthesisUtterance(letter);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.onend = done;
            utterance.onerror = done;
            window.speechSynthesis.speak(utterance);
            setTimeout(done, 1200);
          });
        };

        const handleSpellWordSequence = async (e) => {
          if (e) e.stopPropagation();
          if (isSpellingSequence || !selectedWord) return;
          setIsSpellingSequence(true);
          setActiveLetterIndex(-1);

          try {
            await playWordAudio(selectedWord.text);
            await new Promise(res => setTimeout(res, 900));

            const letters = selectedWord.text.split('');
            for (let i = 0; i < letters.length; i++) {
              const char = letters[i];
              setActiveLetterIndex(i);
              if (/[a-zA-Z0-9]/i.test(char)) {
                await playLetterAudio(char);
              } else {
                await new Promise(res => setTimeout(res, 400));
              }
            }
            setActiveLetterIndex(-1);
            await new Promise(res => setTimeout(res, 900));
            await playWordAudio(selectedWord.text);
          } catch (err) {
            console.error('Spelling sequence error:', err);
          } finally {
            setActiveLetterIndex(-1);
            setIsSpellingSequence(false);
          }
        };

        return (
          <div 
            className="fixed inset-0 z-50 flex flex-col items-center justify-between p-3 sm:p-4 bg-gray-900 select-none overflow-hidden" 
            style={{ 
              backgroundColor: background.startsWith('#') ? background : 'transparent',
              backgroundImage: !background.startsWith('#') ? `url(${background})` : 'none',
              backgroundSize: 'cover',
              backgroundPosition: 'center'
            }}
          >
            {/* Header / Top Bar */}
            <div className="w-full flex justify-between items-center z-10 gap-2">
              {logo ? (
                <img src={logo} alt="Logo" className="h-8 sm:h-12 w-auto max-w-[120px] sm:max-w-[150px] object-contain" />
              ) : (
                <div className="text-2xl sm:text-3xl">🐝</div>
              )}
              <div className="flex items-center space-x-2">
                {removedWordIds.size > 0 && (
                  <button
                    onClick={() => setRemovedWordIds(new Set())}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl shadow transition active:scale-95"
                    title="Restablecer palabras en la ruleta"
                  >
                    🔄 Restablecer ({removedWordIds.size})
                  </button>
                )}
                <button
                  onClick={onClose}
                  className="bg-red-500 hover:bg-red-600 text-white p-2 rounded-full font-bold shadow-lg transition active:scale-95"
                  title="Close Wheel"
                >
                  <XIcon className="h-5 w-5 sm:h-6 sm:w-6" />
                </button>
              </div>
            </div>

            {/* Title above the wheel */}
            <h1 className="text-2xl sm:text-4xl md:text-5xl font-black text-white tracking-widest uppercase drop-shadow-lg z-10 mt-1 mb-0">
              FOOTPRINTS
            </h1>

            {/* Wheel Container */}
            <div className="relative flex-1 flex items-center justify-center my-2 sm:my-4 cursor-pointer w-full" onClick={handleContainerClick}>
              <canvas
                ref={canvasRef}
                width={canvasSize}
                height={canvasSize}
                className="max-w-full max-h-[65vh] rounded-full shadow-2xl"
              />
              
              {!isSpinning && !showCard && validWords.length > 0 && (
                <button
                  onClick={(e) => { e.stopPropagation(); spin(); }}
                  className="absolute inset-0 m-auto w-16 h-16 sm:w-24 sm:h-24 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm sm:text-xl rounded-full shadow-2xl flex items-center justify-center border-2 sm:border-4 border-white transition transform hover:scale-105 active:scale-95"
                >
                  SPIN
                </button>
              )}

              {!isSpinning && !showCard && validWords.length === 0 && (
                <button
                  onClick={(e) => { e.stopPropagation(); setRemovedWordIds(new Set()); }}
                  className="absolute inset-0 m-auto px-4 py-2 sm:px-6 sm:py-3 h-auto max-w-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm sm:text-lg rounded-2xl shadow-2xl flex items-center justify-center border-2 sm:border-4 border-white transition transform hover:scale-105 active:scale-95"
                >
                  🔄 Reiniciar Ruleta
                </button>
              )}
            </div>

            {/* Result Modal Card overlay when wheel stops */}
            {showCard && selectedWord && (
              <div 
                className="fixed inset-0 z-50 flex flex-col items-center justify-between p-4 sm:p-6 bg-black/95 backdrop-blur-md select-none overflow-y-auto"
                onClick={() => {
                  if (!isSpellingSequence) {
                    if (isRecording) {
                      stopAudioRecording();
                      setIsRecording(false);
                    }
                    setShowCard(false);
                  }
                }}
              >
                {/* Top Bar with Close button */}
                <div className="w-full flex justify-between items-center max-w-4xl">
                  <div className="text-yellow-400 font-bold text-xs sm:text-base">
                    {voiceInstruction && (
                      <span className="bg-gray-800/80 px-3 py-1.5 sm:px-4 sm:py-2 rounded-full border border-yellow-500/40 animate-pulse inline-block max-w-[260px] sm:max-w-none truncate">
                        {voiceInstruction}
                      </span>
                    )}
                  </div>
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      if (!isSpellingSequence) {
                        if (isRecording) {
                          stopAudioRecording();
                          setIsRecording(false);
                        }
                        setShowCard(false);
                      }
                    }}
                    className="text-white/70 hover:text-white text-2xl sm:text-3xl font-bold p-2 transition"
                    title="Cerrar"
                  >
                    ✕
                  </button>
                </div>

                {/* Center Word Display with dynamic letter animation */}
                <div className="text-center px-1 max-w-full w-full my-auto flex flex-col items-center justify-center py-2 flex-1 min-w-0 overflow-hidden">
                  <h1 
                    onClick={(e) => {
                      e.stopPropagation();
                      if (!isSpellingSequence && !isSpeakingWholeWord) playImageSound();
                    }}
                    className={`text-[clamp(1.75rem,8vw,5.5rem)] leading-tight font-black drop-shadow-[0_10px_35px_rgba(0,0,0,0.9)] tracking-wider uppercase transform transition-all duration-300 cursor-pointer flex flex-wrap justify-center items-center gap-0.5 sm:gap-1 max-w-full overflow-hidden ${
                      isSpeakingWholeWord ? 'scale-105 sm:scale-110' : ''
                    }`}
                    title="Presiona para escuchar"
                  >
                    {selectedWord.text.split('').map((char, idx) => (
                      <span
                        key={idx}
                        className={`inline-block shrink-0 transition-all duration-300 transform ${
                          isSpeakingWholeWord
                            ? 'text-cyan-300 drop-shadow-[0_0_35px_rgba(34,211,238,1)]'
                            : activeLetterIndex === idx
                            ? 'text-pink-400 scale-125 -translate-y-2 font-black drop-shadow-[0_0_35px_rgba(244,114,182,1)] z-20'
                            : 'text-yellow-300 hover:scale-110'
                        }`}
                      >
                        {char}
                      </span>
                    ))}
                  </h1>

                  <p className="mt-2 sm:mt-4 text-white/80 text-xs sm:text-base font-medium animate-pulse">
                    {isRecording
                      ? '🎙️ Grabando... Presiona el micrófono para parar'
                      : isSpeakingWholeWord
                      ? 'Escuchando la palabra completa... 🔊'
                      : 'Toca la palabra para escucharla 🔊'}
                  </p>
                </div>

                {/* Bottom Action Buttons */}
                <div className="w-full max-w-2xl flex flex-col sm:flex-row items-stretch justify-center gap-2 sm:gap-4 pb-2 sm:pb-4">
                  <div className="flex gap-2 w-full sm:w-auto">
                    {/* Microphone Start/Stop Recording Button */}
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        handleVoiceChallenge();
                      }}
                      disabled={isSpellingSequence}
                      className={`flex-1 sm:flex-none p-3 sm:p-4 rounded-xl sm:rounded-2xl font-bold text-sm sm:text-lg flex items-center justify-center space-x-2 shadow-2xl transition transform active:scale-95 ${
                        isRecording
                          ? 'bg-red-600 text-white animate-pulse ring-4 ring-red-400'
                          : 'bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-400 hover:to-pink-500 text-white'
                      }`}
                      title={isRecording ? "Detener grabación" : "Grabar mi voz"}
                    >
                      <MicrophoneIcon className="h-5 w-5 sm:h-7 sm:w-7" />
                      <span>{isRecording ? "Detener" : "Grabar"}</span>
                    </button>

                    {/* Play Recorded Voice Audio Button */}
                    {recordedAudioUrl && (
                      <button
                        onClick={playRecordedAudio}
                        disabled={isSpellingSequence || isRecording}
                        className={`flex-1 sm:flex-none p-3 sm:p-4 rounded-xl sm:rounded-2xl font-bold text-sm sm:text-lg flex items-center justify-center space-x-2 shadow-2xl transition transform active:scale-95 ${
                          isPlayingRecording
                            ? 'bg-cyan-500 text-white ring-4 ring-cyan-300 animate-pulse'
                            : 'bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white'
                        }`}
                        title="Reproducir mi voz grabada"
                      >
                        <SpeakerWaveIcon className="h-5 w-5 sm:h-7 sm:w-7" />
                        <span>Mi Grabación</span>
                      </button>
                    )}
                  </div>

                  {/* Spell a word Button */}
                  <button
                    onClick={handleSpellWordSequence}
                    disabled={isSpellingSequence || isRecording}
                    className={`flex-1 py-3 px-4 sm:py-4 sm:px-6 rounded-xl sm:rounded-2xl font-bold text-sm sm:text-xl flex items-center justify-center space-x-2 shadow-2xl transition transform active:scale-95 ${
                      isSpellingSequence
                        ? 'bg-pink-600 text-white animate-pulse'
                        : 'bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white'
                    }`}
                  >
                    <span className="text-xl sm:text-2xl">🔤</span>
                    <span>Spell a word</span>
                  </button>

                  {/* Girar de nuevo Button */}
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      if (!isSpellingSequence) {
                        if (isRecording) {
                          stopAudioRecording();
                          setIsRecording(false);
                        }
                        setShowCard(false);
                        spin();
                      }
                    }}
                    disabled={isSpellingSequence}
                    className="flex-1 py-3 px-4 sm:py-4 sm:px-6 rounded-xl sm:rounded-2xl font-bold text-sm sm:text-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white flex items-center justify-center space-x-2 shadow-2xl transition transform active:scale-95 disabled:opacity-50"
                  >
                    <span className="text-xl sm:text-2xl">🎯</span>
                    <span>Girar de nuevo</span>
                  </button>
                </div>
              </div>
            )}

            {/* Footer Credits */}
            <footer className="w-full text-center z-10 pt-1 pb-1">
              <p className="text-xs sm:text-sm font-bold text-white tracking-wide drop-shadow">
                By : Ing. Milko Gonzales C.
              </p>
            </footer>
          </div>
        );
      };

      const App = () => {
        const createInitialWords = () => {
          return DEFAULT_WORDS_LIST.map((wordText, idx) => ({
            id: `word-init-${idx}-${wordText.toLowerCase()}`,
            text: wordText,
            status: WordStatus.COMPLETED,
            phonetic: COMMON_IPA[wordText.toLowerCase()] || `/${wordText.toLowerCase()}/`,
            sentence: `${wordText} is a great word for practice.`,
            imageUrl: createWordSvgIllustration(wordText),
            audioUrl: null,
            audioData: null,
            error: null,
          }));
        };

        const [words, setWords] = useState(createInitialWords);
        const [logo, setLogo] = useState(null);
        const [wheelBackground, setWheelBackground] = useState('#1f2937');
        const [settings, setSettings] = useState({
          courseName: 'My Spelling Bee',
          voice: '',
          rate: 0.7,
          pitch: 1,
          generateImages: true,
          dictationMode: false,
        });
        const [voices, setVoices] = useState([]);
        const [toasts, setToasts] = useState([]);
        const [isGenerating, setIsGenerating] = useState(false);
        const [gameMode, setGameMode] = useState('wheel');
        const [wordForSpelling, setWordForSpelling] = useState(null);
        const [viewingImage, setViewingImage] = useState(null);

        const audioContextRef = useRef(null);
        const wordsRef = useRef([]);
        wordsRef.current = words;

        const addToast = useCallback((message, type = 'info') => {
          setToasts((prev) => [...prev, { id: generateUniqueId('toast'), message, type }]);
        }, []);

        const playSound = useCallback((type) => {
          try {
            const ctx = audioContextRef.current || new (window.AudioContext || window.webkitAudioContext)();
            audioContextRef.current = ctx;
            if (ctx.state === 'suspended') {
              ctx.resume();
            }
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'success') {
              osc.frequency.setValueAtTime(523.25, ctx.currentTime);
              osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            } else if (type === 'error') {
              osc.frequency.setValueAtTime(220, ctx.currentTime);
              osc.frequency.setValueAtTime(180, ctx.currentTime + 0.1);
            } else {
              osc.frequency.setValueAtTime(440, ctx.currentTime);
            }
            
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
          } catch (e) {
            // Audio context not allowed or supported
          }
        }, []);

        useEffect(() => {
          const loadVoices = () => {
            if (typeof window !== 'undefined' && window.speechSynthesis) {
              const availableVoices = window.speechSynthesis.getVoices();
              if (availableVoices.length > 0) {
                const englishVoices = availableVoices.filter(
                  v => v.lang && v.lang.toLowerCase().startsWith('en')
                );
                const voicesToUse = englishVoices.length > 0 ? englishVoices : availableVoices;
                setVoices(voicesToUse);
                
                const defaultVoice = voicesToUse.find(v => v.lang === 'en-US' || v.lang === 'en_US') || voicesToUse[0];
                setSettings(prev => (prev.voice && voicesToUse.some(v => v.name === prev.voice)) ? prev : { ...prev, voice: defaultVoice ? defaultVoice.name : '' });
              }
            }
          };

          loadVoices();
          if (typeof window !== 'undefined' && window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
          }
        }, []);

        const speakWord = useCallback((text, spell = false) => {
          if (!window.speechSynthesis) return;
          window.speechSynthesis.cancel();
          let utterance;
          if (spell) {
            const spelled = text.toUpperCase().split('').join(', ') + '. ' + text + '.';
            utterance = new SpeechSynthesisUtterance(spelled);
          } else {
            utterance = new SpeechSynthesisUtterance(text);
          }
          utterance.lang = 'en-US';
          const match = voices.find(v => v.name === settings.voice);
          if (match) {
            utterance.voice = match;
          }
          utterance.rate = settings.rate;
          utterance.pitch = settings.pitch;
          window.speechSynthesis.speak(utterance);
        }, [voices, settings]);

        const processWord = useCallback(async (wordId) => {
          setWords(prev => prev.map(w => w.id === wordId ? { ...w, status: WordStatus.PROCESSING } : w));
          const word = wordsRef.current.find(w => w.id === wordId);
          if (!word) return;

          try {
            const phoneticPromise = getPhonetic(word.text);
            const sentencePromise = settings.dictationMode ? getSentence(word.text) : Promise.resolve(null);
            const imagePromise = settings.generateImages || !word.imageUrl ? getImage(word.text) : Promise.resolve(word.imageUrl);

            const [phonetic, sentence, imageUrl] = await Promise.all([phoneticPromise, sentencePromise, imagePromise]);

            setWords(prev => prev.map(w => w.id === wordId ? {
              ...w,
              status: WordStatus.COMPLETED,
              phonetic,
              sentence,
              imageUrl,
              audioUrl: w.audioUrl || null,
              audioData: w.audioData || null,
              error: null,
            } : w));
          } catch (error) {
            console.error(error);
            setWords(prev => prev.map(w => w.id === wordId ? {
              ...w,
              status: WordStatus.FAILED,
              error: error.message || 'An unknown error occurred',
            } : w));
          }
        }, [settings.dictationMode, settings.generateImages]);

        const handleGenerate = async (wordIds) => {
          if (isGenerating) {
            addToast("A generation process is already running.", "info");
            return;
          }
          setIsGenerating(true);
          addToast(`Starting generation for ${wordIds.length} word(s)...`, "info");

          await Promise.all(wordIds.map(id => processWord(id)));
          setIsGenerating(false);

          setWords(currentWords => {
            const failedCount = currentWords.filter(w => wordIds.includes(w.id) && w.status === WordStatus.FAILED).length;
            if (failedCount > 0) {
              addToast(`${failedCount} word(s) failed to generate.`, "error");
              playSound('error');
            } else {
              addToast("All words generated successfully!", "success");
              playSound('success');
            }
            return currentWords;
          });
        };

        const handleAddWords = (newWords) => {
          const wordObjects = newWords
            .filter(w => w.trim() !== '')
            .map(w => ({
              id: generateUniqueId(w.trim()),
              text: w.trim(),
              status: WordStatus.PENDING,
              phonetic: null,
              sentence: null,
              imageUrl: null,
              audioUrl: null,
              audioData: null,
              error: null,
            }));
          setWords(prev => [...prev, ...wordObjects]);
          addToast(`${wordObjects.length} words added.`, 'success');
        };

        const handleFileLoad = async (file) => {
          try {
            addToast(`Parsing ${file.name}...`, 'info');
            if (file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
              const parsedWords = await parseDocx(file);
              handleAddWords(parsedWords);
            } else if (file.type === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') {
              const parsedWords = await parseXlsx(file);
              handleAddWords(parsedWords);
            } else if (file.type === 'application/pdf') {
              const newWords = await parsePdf(file);
              setWords(prev => [...prev, ...newWords]);
              addToast(`${newWords.length} words and images added from PDF.`, 'success');
            } else if (file.type === 'application/zip') {
              const result = await parseZip(file, words.map(w => w.text));
              result.matched.forEach(({ text, audioBlob }) => {
                const audioUrl = URL.createObjectURL(audioBlob);
                setWords(prev => prev.map(w => w.text.toLowerCase() === text.toLowerCase() ? {
                  ...w,
                  audioUrl,
                  audioData: audioBlob,
                  status: WordStatus.COMPLETED,
                } : w));
              });
              addToast(`Matched ${result.matched.length} audio files from ZIP.`, 'success');
            }
          } catch (error) {
            addToast(`Failed to parse ${file.name}: ${error.message}`, 'error');
          }
        };

        const handleDownload = () => {
          downloadZip(words, settings.courseName);
          playSound('download');
          addToast(`Downloading ${settings.courseName}.zip`, 'success');
        };

        return (
          <div className="min-h-screen font-sans flex flex-col">
            <header className="bg-white dark:bg-gray-800 shadow-md p-3 sm:p-4 flex flex-col sm:flex-row items-center justify-between gap-3 sticky top-0 z-40">
              <div className="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
                <div className="flex items-center space-x-2">
                  {logo ? (
                    <img src={logo} alt="Logo" className="h-8 sm:h-10 w-auto" />
                  ) : (
                    <div className="text-2xl font-black text-indigo-600">🐝</div>
                  )}
                  <div>
                    <h1 className="text-base sm:text-xl font-bold text-gray-800 dark:text-white leading-tight">{settings.courseName}</h1>
                    <h2 className="text-xs sm:text-sm font-semibold text-gray-500 dark:text-gray-400">Spelling Bee Helper</h2>
                  </div>
                </div>
              </div>
              <div className="flex items-center space-x-2 sm:space-x-4 w-full sm:w-auto justify-end">
                <button
                  onClick={() => setGameMode('wheel')}
                  disabled={words.filter(w => w.status !== WordStatus.FAILED).length === 0}
                  className="flex-1 sm:flex-none px-3 py-2 sm:px-4 sm:py-2 bg-green-500 text-white rounded-lg font-semibold hover:bg-green-600 transition disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center space-x-1.5 text-xs sm:text-base active:scale-95"
                >
                  <PlayIcon className="h-4 w-4 sm:h-5 sm:w-5" />
                  <span>Play Wheel</span>
                </button>
                <button
                  onClick={handleDownload}
                  disabled={words.filter(w => w.status === WordStatus.COMPLETED).length === 0}
                  className="flex-1 sm:flex-none px-3 py-2 sm:px-4 sm:py-2 bg-sky-500 text-white rounded-lg font-semibold hover:bg-sky-600 transition disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center space-x-1.5 text-xs sm:text-base active:scale-95"
                >
                  <DownloadIcon className="h-4 w-4 sm:h-5 sm:w-5" />
                  <span>Download ZIP</span>
                </button>
              </div>
            </header>

            <div className="max-w-7xl mx-auto w-full flex-1">
              <MainContent
                words={words}
                onAddWords={handleAddWords}
                onFileLoad={handleFileLoad}
                onGenerate={handleGenerate}
                onDeleteWord={(id) => setWords(prev => prev.filter(w => w.id !== id))}
                onRegenerateWord={(id) => handleGenerate([id])}
                onOpenSpellingBee={(w) => {
                  setWordForSpelling(w);
                  setGameMode('spell');
                }}
                onImageClick={setViewingImage}
                onSpeak={speakWord}
                isGenerating={isGenerating}
              />
            </div>

            {gameMode === 'wheel' && (
              <SpinningWheel
                words={words}
                onClose={() => setGameMode(null)}
                background={wheelBackground}
                logo={logo}
                onOpenSpellingBee={(w) => {
                  setWordForSpelling(w);
                  setGameMode('spell');
                }}
                onSpeak={speakWord}
              />
            )}

            {gameMode === 'spell' && wordForSpelling && (
              <SpellingBee
                word={wordForSpelling}
                onClose={() => setGameMode(null)}
                onPronounce={(txt) => speakWord(txt, false)}
                onSpellOut={(txt) => speakWord(txt, true)}
              />
            )}

            {viewingImage && (
              <div
                className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 cursor-pointer"
                onClick={() => setViewingImage(null)}
              >
                <div className="relative max-w-full max-h-full flex flex-col items-center justify-center" onClick={(e) => e.stopPropagation()}>
                  {(typeof viewingImage === 'object' ? viewingImage.imageUrl : viewingImage) ? (
                    <img 
                      src={typeof viewingImage === 'object' ? viewingImage.imageUrl : viewingImage} 
                      alt="Word" 
                      onClick={() => {
                        const wordObj = typeof viewingImage === 'object' ? viewingImage : null;
                        if (wordObj && wordObj.audioUrl) {
                          const audio = new Audio(wordObj.audioUrl);
                          audio.play();
                        } else if (wordObj) {
                          speakWord(wordObj.text);
                        }
                      }}
                      className="w-[380px] h-[380px] max-w-full max-h-[75vh] rounded-2xl cursor-pointer hover:opacity-95 transition transform hover:scale-102 object-contain" 
                      title="Presiona para escuchar"
                    />
                  ) : (
                    <div
                      onClick={() => {
                        const wordObj = typeof viewingImage === 'object' ? viewingImage : null;
                        if (wordObj && wordObj.audioUrl) {
                          const audio = new Audio(wordObj.audioUrl);
                          audio.play();
                        } else if (wordObj) {
                          speakWord(wordObj.text);
                        }
                      }}
                      className="w-[380px] h-[380px] max-w-full max-h-[75vh] bg-indigo-600 text-white font-black text-3xl sm:text-6xl flex items-center justify-center rounded-3xl shadow-2xl cursor-pointer hover:scale-105 transition transform text-center p-6 break-words overflow-hidden"
                      title="Presiona para escuchar"
                    >
                      {typeof viewingImage === 'object' ? viewingImage.text : ''}
                    </div>
                  )}
                  {typeof viewingImage === 'object' && viewingImage.text && (
                    <p 
                      onClick={() => {
                        if (viewingImage.audioUrl) {
                          const audio = new Audio(viewingImage.audioUrl);
                          audio.play();
                        } else {
                          speakWord(viewingImage.text);
                        }
                      }}
                      className="text-white text-lg sm:text-2xl font-bold mt-4 bg-black/60 px-4 py-2 sm:px-6 sm:py-2 rounded-full border border-white/20 cursor-pointer hover:underline"
                    >
                      🔊 {viewingImage.text}
                    </p>
                  )}
                  <button 
                    onClick={() => setViewingImage(null)}
                    className="absolute -top-10 right-0 sm:-top-12 text-white text-2xl sm:text-3xl font-bold p-1 hover:opacity-75"
                  >
                    ✕
                  </button>
                </div>
              </div>
            )}

            <Toast toasts={toasts} setToasts={setToasts} />
          </div>
        );
      };

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
